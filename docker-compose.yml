name: jagapadi-v3
services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: jagapadi_v3_postgres
    restart: unless-stopped
    shm_size: 2g
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=512MB"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-jagapadi_v3}
      POSTGRES_USER: ${DB_USERNAME:-jagapadi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jagapadi_secret}
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - jagapadi_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [jagapadi_v3_net]
  redis:
    image: redis:7-alpine
    container_name: jagapadi_v3_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - jagapadi_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [jagapadi_v3_net]
  mailpit:
    image: axllent/mailpit:latest
    container_name: jagapadi_v3_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FORWARD_MAILPIT_PORT:-8025}:8025"
      - "127.0.0.1:${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      TZ: Asia/Jakarta
    networks: [jagapadi_v3_net]
volumes:
  jagapadi_pgdata:
  jagapadi_redisdata:
networks:
  jagapadi_v3_net:
    name: jagapadi_v3_net
    driver: bridge
